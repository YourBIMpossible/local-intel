[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-intel"
version = "0.1.0"
description = "Phase 1 Local Intelligence Experiment implementation"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "psutil>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools]
packages = ["local_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
